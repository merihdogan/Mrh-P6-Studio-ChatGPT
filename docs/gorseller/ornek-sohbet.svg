  <text x="76" y="280" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16"  fill="#dfe5f1">Progress 79% against 82.8% planned by the baseline at the data date (02 Nov 2026).</text>
  <text x="76" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16"  fill="#dfe5f1">Forecast finish 07 May 2027 — 21 days behind the baseline finish (16 Apr 2027).</text>
  <text x="76" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16"  fill="#dfe5f1">9 open critical activities. Biggest slips against the baseline:</text>
