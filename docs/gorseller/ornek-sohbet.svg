    <text x="830" y="22" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#ff7a85">-84 d</text></g><g transform="translate(76 440)"><rect width="844" height="34" rx="9" fill="#ffffff" fill-opacity=".04"/>
